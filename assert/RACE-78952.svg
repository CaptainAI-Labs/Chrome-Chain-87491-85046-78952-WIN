<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dc2626"/><stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="url(#bg)"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">CVE-2026-78952：ReadUpTo 无钳位重试溢出（竞态三拍）</text>
  <rect x="380" y="46" width="200" height="3.5" rx="1.75" fill="url(#accent)"/>
  <text x="480" y="66" text-anchor="middle" font-size="12" fill="#64748b">攻击面：非沙箱 crashpad-handler 信任客户端声明的 extra_memory_ranges（"CPADinfo" 节 +0x18）</text>

  <!-- actors -->
  <g filter="url(#sh)">
    <rect x="60" y="86" width="210" height="58" rx="8" fill="#ffffff" stroke="#dc2626"/>
    <rect x="375" y="86" width="210" height="58" rx="8" fill="#ffffff" stroke="#d97706"/>
    <rect x="690" y="86" width="230" height="58" rx="8" fill="#ffffff" stroke="#4f46e5"/>
  </g>
  <rect x="60" y="86" width="5" height="58" rx="2.5" fill="#dc2626"/>
  <text x="165" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#991b1b">渲染器（崩溃客户端）</text>
  <text x="165" y="130" text-anchor="middle" font-size="10.5" fill="#b91c1c">CrashpadInfo 被 patch 指向 bag</text>
  <rect x="375" y="86" width="5" height="58" rx="2.5" fill="#d97706"/>
  <text x="480" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400e">ms64 竞态器（布防方）</text>
  <text x="480" y="130" text-anchor="middle" font-size="10.5" fill="#b45309">6 线程翻页微脉冲控制器</text>
  <rect x="690" y="86" width="5" height="58" rx="2.5" fill="#4f46e5"/>
  <text x="805" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3730a3">crashpad-handler（非沙箱）</text>
  <text x="805" y="130" text-anchor="middle" font-size="10.5" fill="#4f46e5">ReadUpTo 逐段读 extra ranges</text>

  <!-- beat 1 -->
  <g filter="url(#sh)">
    <rect x="40" y="172" width="280" height="128" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  </g>
  <circle cx="66" cy="198" r="13" fill="#dc2626"/><text x="66" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">1</text>
  <text x="180" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">第一拍：崩溃触发</text>
  <rect x="70" y="216" width="220" height="20" rx="10" fill="#0f172a"/>
  <text x="180" y="230" text-anchor="middle" font-size="10.5" fill="#fca5a5" font-family="Consolas,monospace">*(int*)0xDEAD0021 = 0</text>
  <g font-size="10.5" fill="#475569" text-anchor="middle">
    <text x="180" y="252">payload 主动崩溃（自旋 1s 后）</text>
    <text x="180" y="269">异常沿崩溃管道送 handler</text>
  </g>
  <text x="180" y="290" text-anchor="middle" font-size="10" fill="#991b1b">修复前：渲染器经常"不崩" → 竞态器空等</text>

  <!-- beat 2 -->
  <g filter="url(#sh)">
    <rect x="345" y="172" width="290" height="128" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  </g>
  <circle cx="371" cy="198" r="13" fill="#d97706"/><text x="371" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">2</text>
  <text x="490" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">第二拍：微脉冲 × 无钳位重试</text>
  <g font-size="10.5" font-family="Consolas,monospace" fill="#475569" text-anchor="middle">
    <text x="490" y="226">handler: ReadUpTo(victim页, 0xB8)</text>
    <text x="490" y="243">竞态器: PAGE_NOACCESS ↔ READWRITE</text>
  </g>
  <text x="490" y="263" text-anchor="middle" font-size="10.5" fill="#b45309">首读恰撞 NOACCESS → ReadUpTo 重试</text>
  <text x="490" y="281" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b45309" font-family="Consolas,monospace">重试长度未钳位到 size：读出 0x168</text>
  <rect x="368" y="278" width="244" height="18" rx="9" fill="#fee2e2" opacity="0"/>
  <text x="490" y="297" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626" font-family="Consolas,monospace">0x168 − 0xB8 = 溢出 0xB0 盖相邻堆槽</text>

  <!-- beat 3 -->
  <g filter="url(#sh)">
    <rect x="660" y="172" width="270" height="128" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  </g>
  <circle cx="686" cy="198" r="13" fill="#4f46e5"/><text x="686" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">3</text>
  <text x="800" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">第三拍：模板劫持 → 执行</text>
  <g font-size="10.5" fill="#475569" text-anchor="middle">
    <text x="795" y="226">被盖的槽 = minidump 流的 SMMW 对象</text>
    <text x="795" y="243">smasher 页尾预写劫持模板</text>
    <text x="795" y="261">Next() 把 victim 页 memcpy 进 .data</text>
  </g>
  <text x="795" y="279" text-anchor="middle" font-size="10.5" fill="#4f46e5" font-family="Consolas,monospace">[Q]=DLL名 [Q+8]=LoadLibraryW</text>
  <text x="795" y="297" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">Flush() 尾部 CFG 派发 → 加载 evil.dll</text>

  <line x1="322" y1="236" x2="342" y2="236" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="637" y1="236" x2="657" y2="236" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>

  <!-- dbg signature terminal -->
  <g filter="url(#sh)">
    <rect x="40" y="326" width="890" height="118" rx="10" fill="#0f172a"/>
  </g>
  <circle cx="62" cy="348" r="4.5" fill="#f87171"/><circle cx="78" cy="348" r="4.5" fill="#fbbf24"/><circle cx="94" cy="348" r="4.5" fill="#34d399"/>
  <text x="485" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#e2e8f0">命中签名 —— dbgwrap 观测器抓取的 WAW#0（竞态胜利实锤）</text>
  <g font-family="Consolas,monospace" font-size="11.5">
    <text x="64" y="378" fill="#86efac">[dbgwrap] WAW#0 this=0x5458000bd238 data=0x5458000e6000 size=0xf00</text>
    <text x="64" y="398" fill="#86efac">          cs_=0x7ff6a577c810 <tspan fill="#fbbf24">(=plant+0x10)</tspan> buf_=0x7ff6a577b900 bsz=0x1000 used=0xf00</text>
    <text x="64" y="424" fill="#fbbf24">cs_ 指向 plant 区 = 模板劫持成功 → 随后 Flush 派发 LoadLibraryW(ev64.dll)</text>
  </g>

  <!-- evidence quintet -->
  <text x="480" y="478" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">全链胜工件五重奏（同一时间窗，互相独立又互相印证）</text>
  <g filter="url(#sh)">
    <rect x="40"  y="494" width="166" height="86" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="221" y="494" width="166" height="86" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="402" y="494" width="166" height="86" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="583" y="494" width="166" height="86" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="764" y="494" width="166" height="86" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <g text-anchor="middle">
    <circle cx="123" cy="516" r="10" fill="#dc2626"/><text x="123" y="520" font-size="11" font-weight="bold" fill="#fff">1</text>
    <text x="123" y="546" font-size="10.5" fill="#334155">CalculatorApp 弹出</text>
    <text x="123" y="564" font-size="9.5" fill="#64748b">计算器 = handler 子进程</text>
    <circle cx="304" cy="516" r="10" fill="#d97706"/><text x="304" y="520" font-size="11" font-weight="bold" fill="#fff">2</text>
    <text x="304" y="546" font-size="10.5" fill="#334155">notepad 同秒弹出</text>
    <text x="304" y="564" font-size="9.5" fill="#64748b">evil.dll 双开花签名</text>
    <circle cx="485" cy="516" r="10" fill="#2563eb"/><text x="485" y="520" font-size="11" font-weight="bold" fill="#fff">3</text>
    <text x="485" y="546" font-size="10.5" fill="#334155">%TEMP% 出现 ms64.exe</text>
    <text x="485" y="564" font-size="9.5" fill="#64748b">与 ev64.dll（curl 落盘）</text>
    <circle cx="666" cy="516" r="10" fill="#4f46e5"/><text x="666" y="520" font-size="11" font-weight="bold" fill="#fff">4</text>
    <text x="666" y="546" font-size="10.5" fill="#334155">dbglog WAW#0 命中</text>
    <text x="666" y="564" font-size="9.5" fill="#64748b">cs_=plant+0x10</text>
    <circle cx="847" cy="516" r="10" fill="#059669"/><text x="847" y="520" font-size="11" font-weight="bold" fill="#fff">5</text>
    <text x="847" y="546" font-size="10.5" fill="#334155">控制台链全程绿</text>
    <text x="847" y="564" font-size="9.5" fill="#64748b">VERIFY=0 → DEPLOYED</text>
  </g>
</svg>
