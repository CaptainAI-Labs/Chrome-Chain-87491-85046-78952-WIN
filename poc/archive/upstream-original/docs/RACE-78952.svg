<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#455a64"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#fafafa"/>
  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#263238">CVE-2026-78952：ReadUpTo 无钳位重试溢出（竞态三拍）</text>
  <text x="480" y="50" text-anchor="middle" font-size="12" fill="#607d8b">攻击面：非沙箱 crashpad-handler 信任客户端声明的 extra_memory_ranges（CrashpadInfo "CPADinfo" 节 +0x18）</text>

  <!-- actors -->
  <rect x="60" y="75" width="200" height="60" rx="6" fill="#ffebee" stroke="#b71c1c"/>
  <text x="160" y="100" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b71c1c">渲染器（崩溃客户端）</text>
  <text x="160" y="120" text-anchor="middle" font-size="10.5" fill="#b71c1c">CrashpadInfo 被 patch 指向 bag</text>
  <rect x="380" y="75" width="200" height="60" rx="6" fill="#fff3e0" stroke="#e65100"/>
  <text x="480" y="100" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#bf360c">ms64 竞态器（布防方）</text>
  <text x="480" y="120" text-anchor="middle" font-size="10.5" fill="#e65100">6 线程翻页微脉冲控制器</text>
  <rect x="700" y="75" width="220" height="60" rx="6" fill="#e8eaf6" stroke="#3949ab"/>
  <text x="810" y="100" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a237e">crashpad-handler（非沙箱）</text>
  <text x="810" y="120" text-anchor="middle" font-size="10.5" fill="#283593">ReadUpTo 逐段读 extra ranges</text>

  <!-- beat 1 -->
  <rect x="40" y="160" width="280" height="120" rx="8" fill="white" stroke="#b71c1c" stroke-width="1.5"/>
  <text x="180" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#b71c1c">第一拍：崩溃触发</text>
  <text x="180" y="207" text-anchor="middle" font-size="11" fill="#37474f" font-family="Consolas,monospace">*(int*)0xDEAD0021 = 0</text>
  <text x="180" y="228" text-anchor="middle" font-size="10.5" fill="#546e7a">payload 主动崩溃（自旋 1s 后）</text>
  <text x="180" y="246" text-anchor="middle" font-size="10.5" fill="#546e7a">异常沿崩溃管道送 handler</text>
  <text x="180" y="266" text-anchor="middle" font-size="10.5" fill="#8b0000">修复前：渲染器经常"不崩"</text>
  <text x="180" y="281" text-anchor="middle" font-size="10.5" fill="#8b0000">→ 竞态器空等（UNREACHABLE 日志）</text>

  <!-- beat 2 -->
  <rect x="345" y="160" width="290" height="120" rx="8" fill="white" stroke="#e65100" stroke-width="1.5"/>
  <text x="490" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#bf360c">第二拍：翻页微脉冲 × 无钳位重试</text>
  <text x="490" y="207" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="Consolas,monospace">handler: ReadUpTo(victim页, 0xB8)</text>
  <text x="490" y="225" text-anchor="middle" font-size="10.5" fill="#37474f" font-family="Consolas,monospace">竞态器: PAGE_NOACCESS ↔ READWRITE</text>
  <text x="490" y="245" text-anchor="middle" font-size="10.5" fill="#e65100">首读恰撞 NOACCESS → ReadUpTo 重试</text>
  <text x="490" y="263" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100" font-family="Consolas,monospace">重试长度未钳位到 size：读出 0x168</text>
  <text x="490" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#b71c1c" font-family="Consolas,monospace">0x168 − 0xB8 = 溢出 0xB0 盖相邻堆槽</text>

  <!-- beat 3 -->
  <rect x="660" y="160" width="270" height="120" rx="8" fill="white" stroke="#3949ab" stroke-width="1.5"/>
  <text x="795" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a237e">第三拍：模板劫持 → 代码执行</text>
  <text x="795" y="207" text-anchor="middle" font-size="10.5" fill="#37474f">被盖的槽 = minidump 流的 SMMW 对象</text>
  <text x="795" y="225" text-anchor="middle" font-size="10.5" fill="#37474f">smasher 页尾预写劫持模板</text>
  <text x="795" y="244" text-anchor="middle" font-size="10.5" fill="#283593">Next() 把 victim 页 memcpy 进 .data</text>
  <text x="795" y="262" text-anchor="middle" font-size="10.5" fill="#283593" font-family="Consolas,monospace">[Q]=DLL名 [Q+8]=LoadLibraryW</text>
  <text x="795" y="282" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b71c1c">Flush() 尾部 CFG 派发 → 加载 evil.dll</text>

  <line x1="320" y1="220" x2="343" y2="220" stroke="#455a64" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="635" y1="220" x2="658" y2="220" stroke="#455a64" stroke-width="2" marker-end="url(#ar)"/>

  <!-- dbg signature -->
  <rect x="40" y="305" width="890" height="110" rx="8" fill="#263238"/>
  <text x="60" y="330" font-size="12" fill="#eceff1" font-weight="bold">命中签名（dbgwrap 观测器抓取的 WAW#0 —— 竞态胜利的实锤）</text>
  <g font-family="Consolas,monospace" font-size="11.5" fill="#a5d6a7">
    <text x="60" y="354">[dbgwrap] WAW#0 this=0x5458000bd238 data=0x5458000e6000 size=0xf00</text>
    <text x="60" y="374">          cs_=0x7ff6a577c810 (=plant+0x10)  buf_=0x7ff6a577b900 bsz=0x1000 used=0xf00</text>
    <text x="60" y="398" fill="#ffcc80">cs_ 指向 plant 区 = 模板劫持成功 → 随后 Flush 派发 LoadLibraryW(ev64.dll)</text>
  </g>

  <!-- evidence quintet -->
  <rect x="40" y="435" width="890" height="105" rx="8" fill="#eceff1" stroke="#78909c"/>
  <text x="485" y="460" text-anchor="middle" font-size="13" font-weight="bold" fill="#37474f">全链胜工件五重奏（同一时间窗，互相独立又互相印证）</text>
  <g font-size="11" fill="#455a64" text-anchor="middle">
    <text x="130" y="485">① CalculatorApp 弹出</text>
    <text x="130" y="503">（计算器 = handler 子进程）</text>
    <text x="320" y="485">② notepad 同秒弹出</text>
    <text x="320" y="503">（evil.dll 双开花签名）</text>
    <text x="510" y="485">③ %TEMP% 出现 ms64.exe</text>
    <text x="510" y="503">与 ev64.dll（curl 落盘）</text>
    <text x="700" y="485">④ dbglog WAW#0 命中</text>
    <text x="700" y="503">cs_=plant+0x10</text>
    <text x="865" y="485">⑤ 控制台链全程绿</text>
    <text x="865" y="503">VERIFY=0 → DEPLOYED</text>
  </g>
</svg>
